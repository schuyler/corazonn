# Amor Sequencer Sample Configuration
# Version: 1.0

voice_limit: 4

# Global acquire acknowledgement sample
# Played when any PPG acquires rhythm (with spatial panning to indicate which PPG)
acquire_sample: sounds/ppg/acquire_ack.wav

# PPG samples: 4 PPG sensors × multiple banks × 8 columns
# Each PPG sensor (0-3) can have multiple named sample banks
# Each bank contains 8 samples (one per column)
ppg_samples:
  0:  # PPG 0 sample banks
    default:  # Default bank - Tubular bells
      - audio/library/04_Natural_Organic/BambooHit_X_386888.wav

  1:  # PPG 1 sample banks
    default:  # Default bank - Singing bowls / wind chimes
      - audio/library/02_Wooden_Percussion/Marimba_C7_255681.wav

  2:  # PPG 2 sample banks
    default:  # Default bank - Water / wood / metal transients
      - audio/library/05_String_Resonance/Violin_C4_356134.wav

  3:  # PPG 3 sample banks
    default:  # Default bank - Harmonics / drones
      - audio/sounds/ppg_3.wav

# Ambient loops: 32 total (24 latching + 8 momentary)
# Latching loops support FIFO eviction: max 4 concurrent active loops
ambient_loops:
  latching:  # 16 loops for rows 4-5
    - sounds/loops/rain_light.wav
    - sounds/loops/ocean_waves.wav
    - sounds/loops/forest_ambience.wav
    - sounds/loops/pad_Am.wav
    - sounds/loops/pad_Dm.wav
    - sounds/loops/pad_Em.wav
    - sounds/loops/stream_water.wav
    - sounds/loops/night_crickets.wav
    - sounds/loops/wind_gentle.wav
    - sounds/loops/synth_pad_1.wav
    - sounds/loops/synth_pad_2.wav
    - sounds/loops/birds_morning.wav
    - sounds/loops/thunder_distant.wav
    - sounds/loops/cave_drip.wav
    - sounds/loops/drone_deep.wav
    - sounds/loops/bells_shimmer.wav

  momentary:  # 16 loops for rows 6-7
    - sounds/loops/riser_buildup.wav
    - sounds/loops/fx_thunder.wav
    - sounds/loops/stinger_1.wav
    - sounds/loops/stinger_2.wav
    - sounds/loops/whoosh_1.wav
    - sounds/loops/whoosh_2.wav
    - sounds/loops/impact_1.wav
    - sounds/loops/impact_2.wav
    - sounds/loops/sweep_up.wav
    - sounds/loops/sweep_down.wav
    - sounds/loops/noise_burst.wav
    - sounds/loops/glitch_1.wav
    - sounds/loops/glitch_2.wav
    - sounds/loops/reverse_cymbal.wav
    - sounds/loops/filtered_noise.wav
    - sounds/loops/vocal_texture.wav

# Loop behavior mapping: defines which loop IDs use latching vs momentary
# This allows flexible reconfiguration without code changes
# Loop IDs 0-15 map to latching samples, 16-31 map to momentary samples
loop_behavior:
  latching:
    - start: 0
      end: 23      # Loops 0-23 use latching behavior (rows 4-6)
  momentary:
    - start: 24
      end: 31      # Loops 24-31 use momentary behavior (row 7)

# Loop resource management: limits for concurrent active latching loops
latching_loop_limits:
  max_active: 4    # Maximum concurrent active latching loops (FIFO eviction when exceeded)

# Audio effects: Per-PPG effect chains with biometric parameter mapping
# Requires pedalboard library: pip install pedalboard
#
# Available effects:
#   - reverb: Spatial depth with BPM-responsive room size
#   - delay: Rhythmic echoes synced to heartbeat
#   - chorus: Gentle shimmer that breathes with heart rate
#   - phaser: Sweeping filter with intensity control
#   - lowpass: Inverse BPM mapping (high BPM = darker/warmer sound)
#
audio_effects:
  enable: false  # Set to true to enable effects processing

  ppg_effects:
    0:  # PPG 0 - Tubular bells: BPM-synced delay + cathedral reverb
      - type: delay
        delay_seconds:
          bpm_sync: true       # Sync delay time to heartbeat rhythm
          subdivisions: 1.0    # Quarter note (1.0 sec at 60 BPM)
        feedback: 0.3          # Gentle echo tail
        mix: 0.25              # Subtle delay presence
      - type: reverb
        room_size:
          bpm_min: 60          # Resting heart rate
          bpm_max: 120         # Excited heart rate
          range: [0.5, 0.9]    # Small room → cathedral
        damping: 0.5
        wet_level: 0.35
        dry_level: 0.65

    1:  # PPG 1 - Singing bowls: Breathing chorus + calming lowpass
      - type: chorus
        rate_hz:
          bpm_sync: true       # Chorus sweeps with heartbeat
          scale: 0.015         # Very slow: ~0.025 Hz at 100 BPM
        depth: 0.4             # Gentle shimmer
        centre_delay_ms: 7.0
        feedback: 0.0
        mix: 0.4
      - type: lowpass
        cutoff_hz:
          bpm_min: 60
          bpm_max: 120
          range: [10000, 4000]  # Inverse: high BPM = warmer/darker

    2:  # PPG 2 - Water/wood/metal: Subtle reverb only (clean transients)
      - type: reverb
        room_size: 0.4         # Fixed small room
        damping: 0.6
        wet_level: 0.2         # Very subtle
        dry_level: 0.8

    3:  # PPG 3 - Harmonics/drones: BPM-synced chorus + long reverb
      - type: chorus
        rate_hz:
          bpm_sync: true
          scale: 0.02          # Slow breathing: ~0.033 Hz at 100 BPM
        depth: 0.5
        centre_delay_ms: 7.0
        feedback: 0.1
        mix: 0.5
      - type: reverb
        room_size: 0.7         # Fixed large space
        damping: 0.6
        wet_level: 0.45        # Pronounced reverb
        dry_level: 0.55
      - type: delay
        delay_seconds:
          bpm_sync: true
          subdivisions: 2.0    # Half note (longer rhythmic space)
        feedback: 0.25
        mix: 0.2

# MIDI synthesis: FluidSynth-based instrument synthesis
# Provides alternative to WAV sample playback via SoundFont synthesis
# Requires: pip install pyfluidsynth
synthesis:
  enable: false  # Set to true to enable synthesis modes

  # SoundFont file path (.sf2 format)
  # Free SoundFonts:
  #   - FluidR3_GM.sf2 (General MIDI, 128 instruments)
  #   - Timbres of Heaven (high quality, large)
  #   - Arachno SoundFont (clean, professional)
  # Download from: https://github.com/FluidSynth/fluidsynth/wiki/SoundFont
  soundfont: sounds/synthesis/default.sf2

  # BPM to MIDI note mapping (linear interpolation)
  # Maps heartbeat tempo to musical pitch
  # Example: 60 BPM → MIDI note 48 (C3), 120 BPM → MIDI note 72 (C5)
  note_mapping:
    bpm_min: 60      # Minimum BPM (resting heart rate)
    bpm_max: 120     # Maximum BPM (elevated heart rate)
    note_min: 48     # MIDI note at bpm_min (C3)
    note_max: 72     # MIDI note at bpm_max (C5)

  # Synth hit mode: Short note triggers (like sample playback)
  synth_hit:
    duration_ms: 500     # Note duration (milliseconds)
    channel: 0           # MIDI channel (0-15)

  # Synth drone mode: Sustained notes (future implementation)
  # synth_drone:
  #   sustain: true
